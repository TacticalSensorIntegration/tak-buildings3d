name: Feature request
description: A new building rule, output format or UI change
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: The change, and the problem it solves for you.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: An area or an OSM tag that shows it.
